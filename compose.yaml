services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/next.config.ts:/app/next.config.ts:ro
      - ./apps/web/tsconfig.json:/app/tsconfig.json:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: prik_thai_dev
      WEBULL_MCP_ACCESS_TOKEN: ${WEBULL_MCP_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REFLECTION_MODEL: ${OPENAI_REFLECTION_MODEL:-}
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/tests:/app/tests
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  mongo_data:
