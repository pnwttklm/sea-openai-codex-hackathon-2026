services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/next.config.ts:/app/next.config.ts:ro
      - ./apps/web/tsconfig.json:/app/tsconfig.json:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      FUTURE_YOU_VOICE_ENABLED: ${FUTURE_YOU_VOICE_ENABLED:-0}
      FUTURE_YOU_MEDIA_ENABLED: ${FUTURE_YOU_MEDIA_ENABLED:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2.1-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.6-flare}
      OPENAI_PORTRAIT_VISION_MODEL: ${OPENAI_PORTRAIT_VISION_MODEL:-gpt-5.4-mini}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-prik_thai_dev}
      FUTURE_YOU_USER_ID: ${FUTURE_YOU_USER_ID:-}
      FUTURE_YOU_DEMO: ${FUTURE_YOU_DEMO:-0}
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/tests:/app/tests
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongo:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  mongo_data:
